<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#171310">
<meta name="format-detection" content="telephone=no">
<title>祈瑜星绽 · 圣诞贺卡</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
      onerror="this.onerror=null;this.href='https://cdn.bootcdn.net/ajax/libs/Swiper/11.0.5/swiper-bundle.min.css'">
<style>
/* ==========================================================================
   祈瑜星绽 · Paper
   暖金雾光 + 实体纸质贺卡。插画 base64 内嵌，离线可用。
   ========================================================================== */
:root{
  --bg:#171310;
  --ink:#F7F1E5;
  --dim:rgba(247,241,229,.46);
  --gold:#C6A45E;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","SimSun",Georgia,"Times New Roman",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{
  font-family:var(--sans);color:var(--ink);
  height:100vh;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
img{display:block;max-width:100%}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}

#app{
  position:relative;width:100%;max-width:480px;
  height:100vh;height:100dvh;
  overflow:hidden;isolation:isolate;
  background:
    radial-gradient(120% 70% at 50% -8%, #4A3A25 0%, #32271B 26%, #221B13 52%, #171310 80%, #100D0A 100%);
}

/* ---------- 暖金光斑 ---------- */
.bokeh{
  position:absolute;inset:-10%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 30% at 14% 12%, rgba(226,186,116,.30), transparent 70%),
    radial-gradient(38% 30% at 88% 22%, rgba(214,166,110,.22), transparent 72%),
    radial-gradient(46% 34% at 76% 66%, rgba(198,164,94,.18), transparent 72%),
    radial-gradient(52% 38% at 50% 100%, rgba(150,116,66,.20), transparent 74%);
  -webkit-filter:blur(12px);filter:blur(12px);
  animation:drift 34s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes drift{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(-2.4%,1.5%,0) scale(1.06)}
}
.tint{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.tint-gold{background:radial-gradient(50% 36% at 78% 30%, rgba(230,190,120,.20), transparent 72%)}
.tint-rose{background:radial-gradient(50% 36% at 78% 30%, rgba(238,164,166,.20), transparent 72%)}
.tint-ice{background:radial-gradient(50% 36% at 78% 30%, rgba(168,198,214,.18), transparent 72%)}
#app[data-card="gold"] .tint-gold,
#app[data-card="rose"] .tint-rose,
#app[data-card="ice"] .tint-ice{opacity:1}

#aura{position:absolute;inset:0;z-index:1;pointer-events:none}
.vig{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(126% 88% at 50% 40%, transparent 44%, rgba(0,0,0,.42) 100%)}

/* ---------- 场景 ---------- */
.scene{
  position:absolute;inset:0;z-index:3;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 30px) 18px calc(env(safe-area-inset-bottom) + 26px);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(10px);
  transition:opacity .55s ease, transform .55s ease, visibility 0s .55s;
}
.scene.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .55s ease, transform .55s ease}

.hd{text-align:center;flex:0 0 auto}
.brand{
  font-size:11.5px;font-weight:300;letter-spacing:.44em;text-indent:.44em;
  color:rgba(247,241,229,.66);
  text-shadow:0 0 18px rgba(230,196,132,.35);
}
.sub{
  margin-top:12px;font-family:var(--serif);
  font-size:19px;font-weight:400;letter-spacing:.16em;text-indent:.16em;
  color:#F7F1E5;text-shadow:0 0 22px rgba(230,196,132,.22);
}
.rule{
  width:26px;height:1px;margin:16px auto 0;
  background:linear-gradient(90deg,transparent,rgba(214,182,120,.75),transparent);
}

.stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;margin:6px 0}
.card-swiper{width:100%;overflow:visible;padding:8px 0 14px}
.swiper-slide{display:flex;align-items:center;justify-content:center}

/* ---------- 实体贺卡 ---------- */
.card{
  position:relative;width:100%;aspect-ratio:3/4;
  border-radius:8px;overflow:hidden;
  background:#F6F0E2;
  box-shadow:
    0 24px 48px -18px rgba(0,0,0,.8),
    0 2px 8px rgba(0,0,0,.35);
  transition:box-shadow .5s ease;
}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
/* 纸质光泽：很淡的斜向反光，不破坏插画 */
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,
    rgba(255,255,255,.30) 0%, rgba(255,255,255,.06) 24%,
    rgba(255,255,255,0) 46%, rgba(255,255,255,0) 74%,
    rgba(255,255,255,.10) 100%);
}
/* 细金内框 */
.card::after{
  content:"";position:absolute;inset:9px;border-radius:3px;pointer-events:none;
  border:1px solid rgba(176,142,80,.34);
}
.swiper-slide-active .card{
  box-shadow:
    0 34px 64px -20px rgba(0,0,0,.85),
    0 0 0 1px rgba(216,182,120,.28),
    0 0 44px -8px rgba(216,182,120,.20);
}
.swiper-slide:not(.swiper-slide-active) .card{
  -webkit-filter:brightness(.8) saturate(.92);
  filter:brightness(.8) saturate(.92);
}

.foot{flex:0 0 auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:6px}
.hint{font-size:10.5px;letter-spacing:.3em;text-indent:.3em;color:rgba(247,241,229,.5)}

/* ---------- 按钮：香槟金描边胶囊 ---------- */
.btn{
  position:relative;display:block;width:100%;max-width:282px;
  padding:16px 20px;border-radius:999px;
  font-size:13.5px;font-weight:400;letter-spacing:.22em;text-indent:.22em;
  color:#F3E7CC;text-align:center;
  background:linear-gradient(180deg, rgba(226,196,138,.20), rgba(198,164,94,.08));
  border:1px solid rgba(216,182,120,.42);
  box-shadow:
    0 12px 30px -10px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,240,208,.34);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  transition:transform .18s ease, box-shadow .3s ease, background .3s ease;
  -webkit-user-select:none;user-select:none;
}
.btn:active{transform:scale(.972)}
.ghost{
  margin-top:14px;padding:10px 16px;
  font-size:11px;letter-spacing:.2em;text-indent:.2em;
  color:rgba(247,241,229,.44);
}

/* ---------- 输入页 ---------- */
#s-compose{justify-content:center;gap:22px}
.mini{display:flex;flex-direction:column;align-items:center;gap:9px}
.mini img{
  width:52px;height:69px;object-fit:cover;border-radius:4px;
  box-shadow:0 8px 20px -6px rgba(0,0,0,.7), 0 0 0 1px rgba(216,182,120,.3);
}
.mini span{font-size:10px;letter-spacing:.26em;text-indent:.26em;color:rgba(247,241,229,.5)}

.sheet{
  width:100%;max-width:330px;border-radius:20px;
  padding:24px 24px 16px;
  background:linear-gradient(158deg, rgba(255,248,232,.10), rgba(255,248,232,.035) 55%, rgba(255,248,232,.07));
  border:1px solid rgba(240,220,180,.20);
  box-shadow:
    0 20px 46px -20px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,246,226,.22);
  -webkit-backdrop-filter:blur(15px) saturate(150%);
  backdrop-filter:blur(15px) saturate(150%);
  transition:border-color .4s ease, box-shadow .4s ease;
}
.sheet.focus{
  border-color:rgba(226,196,138,.44);
  box-shadow:
    0 20px 46px -20px rgba(0,0,0,.7),
    0 0 0 4px rgba(226,196,138,.06),
    0 0 40px -6px rgba(226,196,138,.20),
    inset 0 1px 0 rgba(255,246,226,.3);
}
.sheet .label{
  display:block;font-size:8.5px;letter-spacing:.32em;text-indent:.32em;
  color:rgba(240,220,180,.42);margin-bottom:16px;text-align:center;
}
#ta{
  display:block;width:100%;min-height:112px;resize:none;
  background:transparent;border:0;outline:none;
  font-family:var(--serif);font-size:17px;font-weight:400;line-height:1.95;letter-spacing:.04em;
  color:#FBF5E9;text-align:center;
  -webkit-appearance:none;appearance:none;
}
#ta::placeholder{color:rgba(247,241,229,.30);font-family:var(--sans);font-size:14px;letter-spacing:.06em}
.sheet .rule{margin:14px auto 10px;width:100%;background:linear-gradient(90deg,transparent,rgba(240,220,180,.24),transparent)}
.count{font-size:9.5px;letter-spacing:.14em;text-align:right;color:rgba(247,241,229,.34)}
.count b{font-weight:400;color:rgba(240,220,180,.72)}
.count.full b{color:#E8A87C}
.stack{width:100%;display:flex;flex-direction:column;align-items:center}

/* ---------- 信封 ---------- */
#s-letter{justify-content:center}
.env-wrap{width:100%;max-width:340px;perspective:1000px;-webkit-perspective:1000px}
.env{
  position:relative;width:100%;aspect-ratio:3/2;
  transform:translateY(14px) scale(.96);opacity:0;
  transition:opacity .7s ease, transform .9s cubic-bezier(.2,.85,.25,1);
  -webkit-transform-style:preserve-3d;transform-style:preserve-3d;
}
@supports not (aspect-ratio: 3 / 2){ .env{height:220px} }
.env.show{opacity:1;transform:none}

.env-body{
  position:absolute;inset:0;z-index:3;border-radius:10px;
  background:
    linear-gradient(160deg, rgba(255,246,226,.10), rgba(255,246,226,0) 60%),
    linear-gradient(180deg,#E3CFA6 0%,#D6BE90 46%,#C2A575 100%);
  box-shadow:
    0 26px 50px -18px rgba(0,0,0,.8),
    inset 0 1px 0 rgba(255,250,236,.6),
    inset 0 -14px 26px -14px rgba(120,90,44,.5);
}
.env-body::before,.env-body::after{
  content:"";position:absolute;top:0;bottom:0;width:52%;pointer-events:none;
}
.env-body::before{
  left:0;
  background:linear-gradient(100deg, rgba(120,90,44,.20), rgba(255,250,236,.14));
  -webkit-clip-path:polygon(0 0,100% 50%,0 100%);clip-path:polygon(0 0,100% 50%,0 100%);
}
.env-body::after{
  right:0;
  background:linear-gradient(260deg, rgba(120,90,44,.20), rgba(255,250,236,.14));
  -webkit-clip-path:polygon(100% 0,0 50%,100% 100%);clip-path:polygon(100% 0,0 50%,100% 100%);
}
.env-lid{
  position:absolute;left:0;top:0;width:100%;height:56%;z-index:4;
  border-radius:10px 10px 0 0;
  background:linear-gradient(180deg,#EDDCB8 0%,#DCC69A 70%,#CDB381 100%);
  -webkit-clip-path:polygon(0 0,100% 0,50% 100%);clip-path:polygon(0 0,100% 0,50% 100%);
  -webkit-transform-origin:top center;transform-origin:top center;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  transition:transform .95s cubic-bezier(.5,.06,.2,1), z-index 0s .42s;
  box-shadow:inset 0 1px 0 rgba(255,252,240,.7);
  -webkit-filter:drop-shadow(0 3px 4px rgba(90,66,30,.28));
  filter:drop-shadow(0 3px 4px rgba(90,66,30,.28));
}
.env.open .env-lid{transform:rotateX(-172deg);z-index:0}

.env-seal{
  position:absolute;left:50%;top:57%;z-index:5;
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#F6E7C6;
  background:radial-gradient(circle at 34% 28%, #C9A75F, #8A6A2C);
  box-shadow:0 4px 14px rgba(60,42,14,.5), inset 0 1px 0 rgba(255,244,214,.6);
  transform:translate(-50%,-50%);
  transition:opacity .4s ease, transform .55s ease;
}
.env.open .env-seal{opacity:0;transform:translate(-50%,-50%) scale(.45)}

.paper{
  position:absolute;left:7%;top:9%;width:86%;z-index:2;
  min-height:80%;border-radius:4px;padding:18px 20px 14px;
  display:flex;flex-direction:column;
  background:
    radial-gradient(120% 90% at 20% -6%, #FFFDF6 0%, #F8F1E0 58%, #EEE3CB 100%);
  box-shadow:
    0 18px 40px -14px rgba(0,0,0,.7),
    inset 0 0 0 1px rgba(198,164,94,.18);
  color:#4A3B22;
  opacity:0;transform:translateY(16px) scale(.985);
  transition:opacity .8s ease, transform .95s cubic-bezier(.2,.85,.25,1);
}
/* 两段式抽信：先露出信封口，再整体浮到信封前方 */
.paper.show{opacity:1;transform:translateY(-42%) scale(.99)}
.paper.out{
  z-index:6;
  transform:translateY(-56%) scale(1.04);
  box-shadow:
    0 30px 60px -18px rgba(0,0,0,.85),
    inset 0 0 0 1px rgba(198,164,94,.22);
}
.paper::after{
  content:"";position:absolute;inset:7px;pointer-events:none;
  border:1px solid rgba(176,142,80,.24);
}
.p-head{
  font-family:Georgia,"Times New Roman",serif;font-style:italic;
  font-size:17px;letter-spacing:.02em;text-align:center;
  color:#A9853F;margin-bottom:12px;
}
.p-msg{
  flex:1;font-family:var(--serif);
  font-size:16px;font-weight:400;line-height:2;letter-spacing:.04em;
  color:#3E3118;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  text-align:center;
}
.caret{
  display:inline-block;width:1px;height:1em;vertical-align:-.1em;margin-left:2px;
  background:rgba(62,49,24,.5);
  animation:blink .9s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
.p-foot{
  margin-top:14px;font-size:8px;font-weight:300;
  letter-spacing:.3em;text-indent:.3em;text-align:center;
  color:rgba(120,96,52,.42);
}

.acts{
  width:100%;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  margin-top:32px;
  opacity:0;transform:translateY(10px);
  transition:opacity .7s ease, transform .7s ease;
}
.acts.show{opacity:1;transform:none}
.acts .btn{max-width:280px}

#toast{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 36px);z-index:20;
  transform:translate(-50%,10px);
  padding:11px 18px;border-radius:999px;font-size:11.5px;letter-spacing:.1em;
  color:#F7EFDD;background:rgba(40,32,20,.8);
  border:1px solid rgba(226,196,138,.22);
  box-shadow:0 10px 26px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease, transform .3s ease;
  max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.card-swiper.fb{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  padding-left:calc(50% - min(31vw,120px));padding-right:calc(50% - min(31vw,120px));
  scrollbar-width:none;-ms-overflow-style:none}
.card-swiper.fb::-webkit-scrollbar{display:none;width:0;height:0}
.card-swiper.fb .swiper-wrapper{display:flex;align-items:center;gap:16px;width:max-content;height:auto;padding:0}
.card-swiper.fb .swiper-slide{width:min(62vw,240px)!important;height:auto;flex:0 0 auto}
.card-swiper.fb .swiper-slide:not(.center) .card{-webkit-filter:brightness(.72);filter:brightness(.72)}

/* ==========================================================================
   增量：三入口 / 商品选择 / 密码封存 / 查收弹窗 / 3D 礼物盒 / CSS 挂件
   全部为新增规则，不修改原有暖金主题、Swiper 贺卡与信封动画样式
   ========================================================================== */

/* ---------- 首屏：查收 / 送给自己 入口 ---------- */
.entries{display:flex;align-items:center;gap:16px;margin-top:2px}
.entry{
  padding:8px 2px;font-size:11px;letter-spacing:.22em;text-indent:.22em;
  color:rgba(240,220,180,.72);
  border-bottom:1px solid rgba(216,182,120,.34);
  transition:opacity .2s ease;
}
.entry:active{opacity:.55}
.entry-dot{width:3px;height:3px;border-radius:50%;background:rgba(216,182,120,.4)}

/* ---------- 写信面板：紧凑适配 ---------- */
#s-compose{gap:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(max-height:740px){
  #s-compose{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 24px)}
}

/* ---------- 商品单选 ---------- */
.goods{display:flex;gap:12px;width:100%;max-width:330px}
.good{
  flex:1;display:flex;align-items:center;gap:10px;
  padding:13px 12px;border-radius:16px;text-align:left;
  background:linear-gradient(158deg, rgba(255,248,232,.08), rgba(255,248,232,.03));
  border:1px solid rgba(240,220,180,.16);
  color:rgba(247,241,229,.6);
  -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
  transition:border-color .3s ease, background .3s ease, box-shadow .3s ease, color .3s ease;
}
.good.on{
  border-color:rgba(226,196,138,.6);
  background:linear-gradient(158deg, rgba(226,196,138,.18), rgba(198,164,94,.06));
  color:#F3E7CC;
  box-shadow:0 0 24px -6px rgba(226,196,138,.25), inset 0 1px 0 rgba(255,246,226,.22);
}
.good .g-name{font-size:12px;letter-spacing:.03em;line-height:1.5}
.good .g-check{
  margin-left:auto;flex:0 0 auto;width:14px;height:14px;border-radius:50%;
  border:1px solid rgba(240,220,180,.34);position:relative;
}
.good.on .g-check{border-color:#E2C48A;background:#C6A45E;box-shadow:0 0 8px rgba(226,196,138,.5)}
.good.on .g-check::after{
  content:"";position:absolute;left:4px;top:3.5px;width:4px;height:6px;
  border:solid #2E2412;border-width:0 1.5px 1.5px 0;transform:rotate(42deg);
}
/* 商品小图标：纯 CSS */
.gi{position:relative;flex:0 0 auto;width:32px;height:32px}
.gi-w{width:28px;height:28px;margin:2px;border-radius:50%;
  border:6px solid #5C8650;box-shadow:inset 0 0 0 1px #3F6337}
.gi-w::before{
  content:"";position:absolute;left:50%;top:-10px;width:10px;height:10px;margin-left:-5px;
  background:linear-gradient(160deg,#F6D67C,#C9963B);
  -webkit-clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
.gi-w::after{
  content:"";position:absolute;left:50%;bottom:-6px;width:13px;height:9px;transform:translateX(-50%);
  background:linear-gradient(150deg,#D65A52,#A82F2C);
  -webkit-clip-path:polygon(0 0,50% 42%,100% 0,100% 100%,50% 58%,0 100%);
  clip-path:polygon(0 0,50% 42%,100% 0,100% 100%,50% 58%,0 100%);
}
.gi-a{width:27px;height:26px;margin:5px 2px 0;
  background:radial-gradient(circle at 32% 26%, #E9856F 0%, #C4463A 58%, #A82E28 100%);
  border-radius:48% 48% 50% 50%/54% 54% 46% 46%}
.gi-a::before{content:"";position:absolute;left:50%;top:-9px;width:3px;height:10px;
  background:#6B4426;border-radius:2px;transform:rotate(8deg)}
.gi-a::after{content:"";position:absolute;left:54%;top:-10px;width:12px;height:7px;
  background:linear-gradient(140deg,#7FA356,#4F7434);border-radius:80% 10% 80% 10%;transform:rotate(-16deg)}

/* ---------- 密码输入 ---------- */
.pass-sheet{padding-top:18px;padding-bottom:12px}
.pw-input{
  display:block;width:100%;background:transparent;border:0;outline:none;
  font-family:var(--sans);font-size:21px;font-weight:400;
  letter-spacing:.42em;text-indent:.42em;text-align:center;
  color:#FBF5E9;padding:4px 0 8px;
  -webkit-appearance:none;appearance:none;
}
.pw-input::placeholder{font-size:13px;letter-spacing:.12em;text-indent:.12em;color:rgba(247,241,229,.3)}
.pw-hint{font-size:9.5px;letter-spacing:.14em;text-align:center;color:rgba(247,241,229,.34)}

/* ---------- 封存成功提示 ---------- */
.seal-info{
  margin-bottom:14px;font-size:12px;letter-spacing:.06em;
  color:rgba(247,241,229,.78);text-align:center;line-height:1.9;
}
.seal-info b{font-weight:500;color:#F0D9A6;letter-spacing:.2em;margin-left:6px;font-size:15px}

/* ---------- 查收弹窗 ---------- */
.modal{
  position:absolute;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease, visibility 0s .35s;
}
.modal.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .35s ease}
.m-mask{
  position:absolute;inset:0;background:rgba(12,9,6,.62);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.m-card{
  position:relative;width:82%;max-width:322px;border-radius:20px;
  padding:26px 24px 12px;text-align:center;
  background:linear-gradient(158deg, rgba(56,44,28,.92), rgba(34,27,19,.94));
  border:1px solid rgba(240,220,180,.24);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,246,226,.2);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  transform:translateY(16px) scale(.97);
  transition:transform .35s cubic-bezier(.2,.85,.25,1);
}
.modal.show .m-card{transform:none}
.m-title{font-family:var(--serif);font-size:19px;letter-spacing:.2em;text-indent:.2em;color:#F7F1E5}
.m-sub{margin-top:10px;font-size:11px;letter-spacing:.08em;line-height:1.9;color:rgba(247,241,229,.5)}
.m-card .pw-input{margin-top:14px;border-bottom:1px solid rgba(240,220,180,.2);padding-bottom:14px}
.m-card .btn{margin-top:22px;max-width:100%}
.m-card .ghost{margin-bottom:4px}

/* ---------- 3D 礼物盒 ---------- */
#s-gift{justify-content:center}
.gift-stage{
  position:relative;width:270px;height:250px;
  perspective:950px;-webkit-perspective:950px;
  transition:transform 1s cubic-bezier(.2,.85,.25,1);
}
.gift-stage.settle{transform:translateY(58px) scale(.8)}
.gift{
  position:absolute;left:50%;top:52%;width:0;height:0;
  -webkit-transform-style:preserve-3d;transform-style:preserve-3d;
  opacity:0;
  transform:rotateX(16deg) rotateY(-208deg) scale(.32);
  transition:transform 1.15s cubic-bezier(.2,.8,.25,1), opacity .55s ease;
}
.gift.enter{opacity:1;transform:rotateX(16deg) rotateY(-22deg) scale(1)}
.wp{position:absolute;left:0;top:0;-webkit-transform-style:preserve-3d;transform-style:preserve-3d}
.face{position:absolute;backface-visibility:visible;-webkit-backface-visibility:visible}

/* 盒身四壁：金色缎面 + 中央竖丝带 */
.wall{
  left:-90px;top:-70px;width:180px;height:140px;
  -webkit-transform-origin:50% 100%;transform-origin:50% 100%;
  background:
    linear-gradient(90deg, transparent 42%, rgba(255,246,222,.5) 46%, rgba(255,250,236,.72) 50%, rgba(255,246,222,.5) 54%, transparent 58%),
    linear-gradient(180deg,#E8D5AC 0%,#D9C091 46%,#BFA16E 100%);
  box-shadow:inset 0 0 0 1px rgba(255,250,236,.28), inset 0 -18px 26px -16px rgba(110,80,36,.5);
  transition:transform 1.1s cubic-bezier(.34,.72,.26,1);
}
.wp-front{transform:translateZ(90px)}
.wp-back{transform:rotateY(180deg) translateZ(90px)}
.wp-right{transform:rotateY(90deg) translateZ(90px)}
.wp-left{transform:rotateY(-90deg) translateZ(90px)}
.gift.bloom .wall{transform:rotateX(-90deg)}
.gift.bloom .wp-back .wall{transition-delay:.08s}
.gift.bloom .wp-left .wall{transition-delay:.05s}
.gift.bloom .wp-right .wall{transition-delay:.05s}

/* 盒底 */
.g-base{
  left:-90px;top:-90px;width:180px;height:180px;
  transform:rotateX(-90deg) translateZ(70px);
  background:radial-gradient(70% 70% at 50% 40%, #E3CFA6, #B89B68);
  box-shadow:inset 0 0 0 1px rgba(255,250,236,.2);
}

/* 盒盖：外层负责开盖位移，内层负责空间定位 */
.wp-lid{transition:transform .85s cubic-bezier(.4,.1,.3,1), opacity .8s ease}
.lid-face{
  left:-99px;top:-99px;width:198px;height:198px;
  transform:rotateX(90deg) translateZ(70px);
  background:
    linear-gradient(90deg, transparent 44%, rgba(255,246,222,.55) 47%, rgba(255,250,236,.8) 50%, rgba(255,246,222,.55) 53%, transparent 56%),
    linear-gradient(0deg, transparent 44%, rgba(255,246,222,.55) 47%, rgba(255,250,236,.8) 50%, rgba(255,246,222,.55) 53%, transparent 56%),
    linear-gradient(150deg,#F0E0BC 0%,#E0C99C 55%,#C9AE7C 100%);
  box-shadow:inset 0 0 0 1px rgba(255,252,240,.5), inset 0 0 24px rgba(140,104,50,.18);
}
.gift.open .wp-lid{transform:translateY(-170px) rotateX(28deg) rotateZ(-16deg);opacity:0}
/* 盖顶蝴蝶结 */
.lid-bow{position:absolute;left:0;top:0;width:0;height:0;transform:rotateX(90deg) translateZ(74px)}
.lid-bow i{position:absolute;background:linear-gradient(150deg,#F4E4BE,#CBA96E);box-shadow:inset 0 0 0 1px rgba(255,250,236,.5)}
.lid-bow .b1{left:-34px;top:-13px;width:30px;height:24px;border-radius:62% 38% 56% 44%;transform:rotate(-16deg)}
.lid-bow .b2{left:4px;top:-13px;width:30px;height:24px;border-radius:38% 62% 44% 56%;transform:rotate(16deg)}
.lid-bow .b3{left:-8px;top:-8px;width:16px;height:16px;border-radius:50%}

.gift-shadow{
  position:absolute;left:50%;bottom:0;width:190px;height:30px;
  transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.55), transparent 72%);
  -webkit-filter:blur(5px);filter:blur(5px);
}

/* 礼物信纸：复用原版纸张视觉，独立类避免与信封规则耦合 */
.g-paper{
  position:absolute;left:50%;top:42%;z-index:6;
  width:min(80%,300px);min-height:190px;
  border-radius:4px;padding:20px 22px 14px;
  display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 20% -6%, #FFFDF6 0%, #F8F1E0 58%, #EEE3CB 100%);
  box-shadow:0 30px 60px -18px rgba(0,0,0,.85), inset 0 0 0 1px rgba(198,164,94,.18);
  color:#4A3B22;
  opacity:0;transform:translate(-50%,-38%) scale(.55);
  transition:transform .85s cubic-bezier(.2,.85,.25,1), opacity .6s ease;
}
.g-paper.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.g-paper::after{content:"";position:absolute;inset:7px;pointer-events:none;border:1px solid rgba(176,142,80,.24)}

/* ---------- 信纸右上角 CSS 挂件 ---------- */
.charm{
  position:absolute;top:-20px;right:-13px;width:64px;height:64px;z-index:8;
  transform:rotate(14deg);pointer-events:none;
  -webkit-filter:drop-shadow(0 4px 6px rgba(0,0,0,.28));
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.28));
}
.charm .ca{display:none}
.charm[data-k="apple"] .ca{display:block}
.charm[data-k="apple"] .cw{display:none}
/* 花环：松枝绿环 + 金红彩球 + 顶星 + 红蝴蝶结 */
.cw-ring{
  position:absolute;left:9px;top:9px;width:44px;height:44px;border-radius:50%;
  border:9px solid #4C7A41;
  box-shadow:inset 0 0 0 2px #3A6132, inset 0 2px 3px rgba(255,255,255,.22), 0 1px 2px rgba(0,0,0,.18);
}
.cw-dot{position:absolute;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #F6D67C, #B8862B)}
.cw-dot.d1{left:16px;top:11px}
.cw-dot.d2{right:12px;top:24px;background:radial-gradient(circle at 30% 30%, #E9856F, #A82F2C)}
.cw-dot.d3{left:12px;bottom:19px;background:radial-gradient(circle at 30% 30%, #E9856F, #A82F2C)}
.cw-dot.d4{right:20px;bottom:11px}
.cw-star{
  position:absolute;left:50%;top:-1px;width:16px;height:16px;margin-left:-8px;
  background:linear-gradient(160deg,#F6D67C,#C9963B);
  -webkit-clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
.cw-bow{position:absolute;left:50%;bottom:0;width:0;height:0}
.cw-bow b{position:absolute;display:block}
.cw-bow .bl{left:-15px;top:-6px;width:13px;height:10px;
  background:linear-gradient(150deg,#D65A52,#A82F2C);border-radius:60% 40% 55% 45%;transform:rotate(-24deg)}
.cw-bow .br{left:2px;top:-6px;width:13px;height:10px;
  background:linear-gradient(150deg,#D65A52,#A82F2C);border-radius:40% 60% 45% 55%;transform:rotate(24deg)}
.cw-bow .bk{left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#B23A34}
.cw-bow .bt1{left:-7px;top:2px;width:4px;height:11px;
  background:linear-gradient(180deg,#C4483F,#9E2E2A);border-radius:0 0 3px 3px;transform:rotate(16deg)}
.cw-bow .bt2{left:3px;top:2px;width:4px;height:11px;
  background:linear-gradient(180deg,#C4483F,#9E2E2A);border-radius:0 0 3px 3px;transform:rotate(-16deg)}
/* 平安果：布艺红苹果 + 棕柄 + 绿叶 + 高光 */
.ca-body{
  position:absolute;left:12px;top:17px;width:40px;height:38px;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.045) 0 3px, transparent 3px 6px),
    radial-gradient(circle at 32% 26%, #E9856F 0%, #CF4B3C 46%, #A82E28 100%);
  border-radius:48% 48% 50% 50%/54% 54% 46% 46%;
  box-shadow:inset 0 -4px 6px rgba(120,20,20,.25);
}
.ca-body::before{
  content:"";position:absolute;left:50%;top:-2px;width:13px;height:7px;
  transform:translateX(-50%);background:rgba(96,22,20,.32);border-radius:50%;
  -webkit-filter:blur(1px);filter:blur(1px);
}
.ca-stem{position:absolute;left:31px;top:7px;width:4px;height:13px;
  background:linear-gradient(90deg,#8A5A34,#5F3B1F);border-radius:2px;transform:rotate(10deg)}
.ca-leaf{position:absolute;left:36px;top:6px;width:16px;height:9px;
  background:linear-gradient(140deg,#7FA356,#4F7434);border-radius:80% 10% 80% 10%;transform:rotate(-18deg)}
.ca-shine{position:absolute;left:20px;top:24px;width:8px;height:13px;
  background:rgba(255,255,255,.32);border-radius:50%;transform:rotate(24deg);
  -webkit-filter:blur(1px);filter:blur(1px)}

</style>
</head>
<body>

<div id="app" data-card="gold">
  <div class="bokeh"></div>
  <div class="tint tint-gold"></div>
  <div class="tint tint-rose"></div>
  <div class="tint tint-ice"></div>
  <canvas id="aura"></canvas>
  <div class="vig"></div>

  <!-- ================= 选卡 ================= -->
  <section class="scene on" id="s-pick">
    <div class="hd">
      <div class="brand">祈 瑜 星 绽</div>
      <div class="sub">选一张送给 TA</div>
      <div class="rule"></div>
    </div>

    <div class="stage">
      <div class="swiper card-swiper" id="swiper">
        <div class="swiper-wrapper" id="swiperWrap"></div>
      </div>
    </div>

    <div class="foot">
      <div class="hint">左右滑动</div>
      <button class="btn" id="btnConfirm" type="button">确认选择</button>
      <div class="entries">
        <button class="entry" id="btnReceive" type="button">查收信件</button>
        <span class="entry-dot"></span>
        <button class="entry" id="btnSelf" type="button">送给自己</button>
      </div>
    </div>
  </section>

  <!-- ================= 写悄悄话 ================= -->
  <section class="scene" id="s-compose">
    <div class="mini"><img id="miniImg" alt="已选贺卡"><span id="miniName">经典金</span></div>

    <div class="goods" id="goods">
      <button class="good on" data-good="wreath" type="button">
        <span class="gi gi-w"></span>
        <span class="g-name">圣诞巧克力花环</span>
        <span class="g-check"></span>
      </button>
      <button class="good" data-good="apple" type="button">
        <span class="gi gi-a"></span>
        <span class="g-name">平安果</span>
        <span class="g-check"></span>
      </button>
    </div>


    <div class="sheet" id="sheet">
      <span class="label">A SECRET WORD</span>
      <textarea id="ta" maxlength="50" placeholder="写下一句对TA的悄悄话..." autocomplete="off" spellcheck="false"></textarea>
      <div class="rule"></div>
      <div class="count" id="count"><b>0</b> / 50</div>
    </div>

    <div class="sheet pass-sheet">
      <span class="label">SEAL WITH A CODE</span>
      <input class="pw-input" id="pw" type="text" maxlength="8" placeholder="设置8位字母+数字密码" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="rule"></div>
      <div class="pw-hint">8 位，需同时包含字母和数字</div>
    </div>

    <div class="stack">
      <button class="btn wide" id="btnGen" type="button">封存信件</button>
      <button class="ghost" id="btnBack" type="button">重新选卡</button>
    </div>
  </section>

  <!-- ================= 信封 ================= -->
  <section class="scene" id="s-letter">
    <div class="env-wrap">
      <div class="env" id="env">
        <div class="env-body"></div>
        <div class="env-lid"></div>
        <div class="paper" id="paper">
          <div class="p-head">Merry Christmas</div>
          <div class="p-msg" id="pMsg"></div>
          <div class="p-foot">WITH LOVE · 祈瑜星绽</div>
        </div>
        <div class="env-seal">&#10022;</div>
      </div>
    </div>

    <div class="acts" id="acts">
      <div class="seal-info" id="sealInfo">信件已封存，密码是：<b id="sealPw"></b></div>
      <button class="btn" id="btnCopy" type="button">一键复制密码</button>
      <button class="ghost" id="btnAgain" type="button">再做一张</button>
    </div>
  </section>

  <!-- ================= 礼物盒（查收 / 送给自己） ================= -->
  <section class="scene" id="s-gift">
    <div class="gift-stage" id="giftStage">
      <div class="gift" id="gift">
        <div class="wp"><div class="face g-base"></div></div>
        <div class="wp wp-back"><div class="face wall"></div></div>
        <div class="wp wp-left"><div class="face wall"></div></div>
        <div class="wp wp-right"><div class="face wall"></div></div>
        <div class="wp wp-front"><div class="face wall"></div></div>
        <div class="wp wp-lid">
          <div class="face lid-face"></div>
          <div class="lid-bow"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
        </div>
      </div>
      <div class="gift-shadow"></div>
    </div>

    <div class="g-paper" id="giftPaper">
      <span class="charm" id="charm" data-k="wreath">
        <span class="cw">
          <i class="cw-ring"></i>
          <i class="cw-dot d1"></i><i class="cw-dot d2"></i>
          <i class="cw-dot d3"></i><i class="cw-dot d4"></i>
          <i class="cw-star"></i>
          <i class="cw-bow"><b class="bl"></b><b class="br"></b><b class="bk"></b><b class="bt1"></b><b class="bt2"></b></i>
        </span>
        <span class="ca">
          <i class="ca-body"></i><i class="ca-stem"></i><i class="ca-leaf"></i><i class="ca-shine"></i>
        </span>
      </span>
      <div class="p-head">Merry Christmas</div>
      <div class="p-msg" id="gMsg"></div>
      <div class="p-foot">WITH LOVE · 祈瑜星绽</div>
    </div>

    <div class="acts" id="giftActs">
      <button class="btn" id="btnGiftBack" type="button">返回首页</button>
    </div>
  </section>

  <!-- ================= 查收密码弹窗 ================= -->
  <div class="modal" id="modal">
    <div class="m-mask" id="mMask"></div>
    <div class="m-card">
      <div class="m-title">查收信件</div>
      <div class="m-sub">输入 8 位密码<br>拆开 TA 送你的圣诞礼物</div>
      <input class="pw-input" id="pwIn" type="text" maxlength="8" placeholder="8 位密码" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" id="btnOpen" type="button">拆开礼物</button>
      <button class="ghost" id="mClose" type="button">取消</button>
    </div>
  </div>

  <div id="toast"></div>
</div>

  var CARDS = [
    { id: 'gold', name: '经典金',   en: 'CLASSIC GOLD' },
    { id: 'rose', name: '玫瑰金',   en: 'ROSE GOLD' },

  /* ================= 卡片 ================= */
  (function buildCards() {
    var wrap = $('#swiperWrap');
    var html = '';
    CARDS.forEach(function (c, i) {
      html +=
        '<div class="swiper-slide">' +
          '<div class="card c-' + c.id + '">' +
            '<img src="' + ART[c.id] + '" alt="' + c.name + '" draggable="false">' +
          '</div>' +
        '</div>';
    });
    wrap.innerHTML = html;
  })();

  function applyCard(id) {
    var c = null;
    for (var i = 0; i < CARDS.length; i++) { if (CARDS[i].id === id) { c = CARDS[i]; break; } }
    if (!c) c = CARDS[0];
    state.card = c.id;
    app.setAttribute('data-card', c.id);
    var mi = document.getElementById('miniImg');
    var mn = document.getElementById('miniName');
    if (mi && ART[c.id]) mi.src = ART[c.id];
    if (mn) mn.textContent = c.name;
  }

  /* ================= 场景 ================= */
  function showScene(id) {
    $$('.scene').forEach(function (s) { s.classList.remove('on'); });
    var el = document.getElementById(id);
    if (el) el.classList.add('on');
  }

  /* ================= toast ================= */
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ================= 粒子 ================= */
  (function particles() {
    var cvs = document.getElementById('aura');
    if (!cvs || !cvs.getContext) return;
    var ctx = cvs.getContext('2d');
    var W = 0, H = 0, DP = 1, dots = [], streak = null, lastStreak = 0, raf = null;

    function size() {
      DP = Math.min(window.devicePixelRatio || 1, 2);
      W = app.clientWidth; H = app.clientHeight;
      cvs.width = W * DP; cvs.height = H * DP;
      cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
      ctx.setTransform(DP, 0, 0, DP, 0, 0);
      seed();
    }

    function seed() {
      dots = [];
      var n = W < 420 ? 24 : 32;
      for (var i = 0; i < n; i++) {
        dots.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.05 + 0.45,
          vy: -(Math.random() * 0.11 + 0.03),
          ph: Math.random() * Math.PI * 2,
          sw: Math.random() * 0.7 + 0.25
        });
      }
    }

    function frame(t) {
      ctx.clearRect(0, 0, W, H);

      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        d.y += d.vy;
        d.ph += 0.0065;
        if (d.y < -8) { d.y = H + 8; d.x = Math.random() * W; }
        var a = 0.15 + 0.15 * Math.sin(d.ph);
        if (a < 0.03) a = 0.03;
        ctx.beginPath();
        ctx.arc(d.x + Math.sin(d.ph * 1.25) * 3.2, d.y, d.r, 0, 6.2832);
        ctx.fillStyle = 'rgba(238,214,164,' + a.toFixed(3) + ')';
        ctx.fill();
      }

      /* 极淡的偶发流星 */
      if (!streak && t - lastStreak > 11000) {
        lastStreak = t;
        if (Math.random() < 0.55) {
          streak = { x: W * 0.9, y: 30, vx: -1.35, vy: 0.95, life: 1 };
        }
      }
      if (streak) {
        streak.x += streak.vx; streak.y += streak.vy; streak.life -= 0.0135;
        if (streak.life <= 0 || streak.y > H + 20) {
          streak = null;
        } else {
          var tx = streak.x - streak.vx * 26, ty = streak.y - streak.vy * 26;
          var g = ctx.createLinearGradient(streak.x, streak.y, tx, ty);
          g.addColorStop(0, 'rgba(240,220,176,' + (0.45 * streak.life).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(240,220,176,0)');
          ctx.strokeStyle = g; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(streak.x, streak.y); ctx.lineTo(tx, ty); ctx.stroke();
        }
      }

      raf = requestAnimationFrame(frame);
    }

    size();
    window.addEventListener('resize', size);
    raf = requestAnimationFrame(frame);

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      } else if (!raf) {
        raf = requestAnimationFrame(frame);
      }
    });
  })();

  /* ================= Swiper：异步加载 + 多源兜底 + 降级 ================= */
  var SWIPER_SRC = [
    'https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js',
    'https://cdn.bootcdn.net/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js',
    'https://registry.npmmirror.com/swiper/11.0.5/files/swiper-bundle.min.js'
  ];
  var swiper = null;
  var loadPromise = null;

  function ensureSlides() {
    var wrap = $('#swiperWrap');
    if (wrap.children.length > 3) return;
    var base = Array.prototype.slice.call(wrap.children);
    for (var k = 0; k < 2; k++) {
      base.forEach(function (node) { wrap.appendChild(node.cloneNode(true)); });
    }
  }

  function loadSwiper(done) {
    if (window.Swiper) { done(); return; }
    if (!loadPromise) {
      loadPromise = new Promise(function (resolve) {
        var i = 0;
        (function next() {
          if (i >= SWIPER_SRC.length) { resolve(); return; }
          var s = document.createElement('script');
          s.src = SWIPER_SRC[i++];
          s.async = true;
          var timer = setTimeout(function () { s.onload = s.onerror = null; next(); }, 8000);
          s.onload = function () { clearTimeout(timer); window.Swiper ? resolve() : next(); };
          s.onerror = function () { clearTimeout(timer); next(); };
          document.head.appendChild(s);
        })();
      });
    }
    loadPromise.then(function () {
      window.Swiper ? done() : initFallback();
    });
  }

  function initSwiper() {
    if (swiper || $('#swiper').classList.contains('fb')) return;
    ensureSlides();

    var start = 0;
    for (var i = 0; i < CARDS.length; i++) { if (CARDS[i].id === state.card) { start = i; } }

    swiper = new Swiper('#swiper', {
      effect: 'coverflow',
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: 1.5,
      spaceBetween: 12,
      loop: true,
      speed: 560,
      initialSlide: start,
      followFinger: true,
      resistanceRatio: 0.6,
      coverflowEffect: {
        rotate: 10,
        stretch: 0,
        depth: 140,
        modifier: 1,
        slideShadows: false
      },
      on: {
        init: function (sw) { applyCard(CARDS[sw.realIndex % CARDS.length].id); },
        slideChange: function (sw) { applyCard(CARDS[sw.realIndex % CARDS.length].id); }
      }
    });
  }

  /* 降级：CDN 全挂时用原生横滑 */
  function initFallback() {
    var host = $('#swiper');
    if (!host || host.classList.contains('fb')) return;
    host.classList.add('fb');

    var slides = $$('.swiper-slide', host);
    var timer = null;

    function mark() {
      var box = host.getBoundingClientRect();
      var center = box.left + box.width / 2;
      var best = 0, bestD = Infinity, i, r, d;
      for (i = 0; i < slides.length; i++) {
        r = slides[i].getBoundingClientRect();
        d = Math.abs(r.left + r.width / 2 - center);
        if (d < bestD) { bestD = d; best = i; }
      }
      for (i = 0; i < slides.length; i++) {
        slides[i].classList.toggle('center', i === best);
      }
      applyCard(CARDS[best % CARDS.length].id);
    }

    host.addEventListener('scroll', function () {
      clearTimeout(timer);
      timer = setTimeout(mark, 130);
    }, { passive: true });

    slides.forEach(function (s) {
      s.addEventListener('click', function () {
        s.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      });
    });

    var idx = 0;
    for (var j = 0; j < CARDS.length; j++) { if (CARDS[j].id === state.card) { idx = j; } }
    slides[idx].scrollIntoView({ inline: 'center', block: 'nearest' });
    setTimeout(mark, 80);
  }

  /* ================= 输入页 ================= */
  var ta = $('#ta');
  var countEl = $('#count');
  var sheet = $('#sheet');

  function refreshCount() {
    var n = ta.value.length;
    countEl.querySelector('b').textContent = n;
    countEl.classList.toggle('full', n >= MAX);
  }

  ta.addEventListener('input', function () {
    if (ta.value.length > MAX) { ta.value = ta.value.slice(0, MAX); }
    refreshCount();
  });

  ta.addEventListener('focus', function () {
    sheet.classList.add('focus');
    setTimeout(function () {
      try { ta.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
    }, 260);
  });
  ta.addEventListener('blur', function () { sheet.classList.remove('focus'); });

  /* ================= 链接 ================= */
  function applyUrl(text) {
    var search = '?text=' + encodeURIComponent(text) + '&card=' + encodeURIComponent(state.card);
    try { history.replaceState(null, '', location.pathname + search); } catch (e) {}
  }

  function buildUrl(text) {
    var base = location.href.split('#')[0].split('?')[0];
    return base + '?text=' + encodeURIComponent(text) + '&card=' + encodeURIComponent(state.card);
  }

  /* ================= 打字机 ================= */
  function typewriter(el, text, speed) {
    return new Promise(function (resolve) {
      el.textContent = '';
      var caret = document.createElement('span');
      caret.className = 'caret';
      el.appendChild(caret);

      var i = 0;
      (function tick() {
        if (i < text.length) {
          el.insertBefore(document.createTextNode(text.charAt(i)), caret);
          i++;
          setTimeout(tick, speed);
        } else {
          setTimeout(function () {
            if (caret.parentNode) caret.parentNode.removeChild(caret);
            resolve();
          }, 500);
        }
      })();
    });
  }

  /* ================= 信封流程 ================= */
  var env = $('#env');
  var paper = $('#paper');
  var pMsg = $('#pMsg');
  var acts = $('#acts');

  function resetLetter() {
    env.classList.remove('open', 'show');
    paper.classList.remove('show', 'out');
    acts.classList.remove('show');
    pMsg.textContent = '';
  }

  function playLetter(msg, isSender) {
    state.sender = !!isSender;
    state.text = msg;
    resetLetter();

    return sleep(240).then(function () {
      env.classList.add('show');
      return sleep(620);
    }).then(function () {
      env.classList.add('open');
      return sleep(720);
    }).then(function () {
      paper.classList.add('show');
      return sleep(620);
    }).then(function () {
      paper.classList.add('out');
      return sleep(560);
    }).then(function () {
      return typewriter(pMsg, msg, 46);
    }).then(function () {
      return sleep(380);
    }).then(function () {
      $('#btnCopy').style.display = state.sender ? '' : 'none';
      $('#sealInfo').style.display = state.sender ? '' : 'none';
      acts.classList.add('show');
    });
  }

  /* ================= 交互 ================= */
  $('#btnConfirm').addEventListener('click', function () {
    applyCard(state.card);
    showScene('s-compose');
    ta.value = '';
    refreshCount();
  });

  $('#btnBack').addEventListener('click', function () {
    showScene('s-pick');
    loadSwiper(initSwiper);
  });

  $('#btnGen').addEventListener('click', async function () {
    var raw = ta.value.replace(/\u00a0/g, ' ').trim();
    if (!raw) {
      toast('先写一句悄悄话吧');
      try { ta.focus(); } catch (e) {}
      return;
    }
    var pw = pwEl.value.trim();
    if (!/^[A-Za-z0-9]{8}$/.test(pw) || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) {
      toast('密码需 8 位，同时包含字母和数字');
      try { pwEl.focus(); } catch (e) {}
      return;
    }
    var btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    state.password = pw;
    var letter = { product: state.good, message: raw, card: state.card, password: pw, ts: Date.now() };
    saveLetter(letter);
    var remoteOk = true;
    try { await remoteSave(letter); } catch (e) { remoteOk = false; }
    btn.disabled = false;
    sealPwEl.textContent = pw;
    showScene('s-letter');
    playLetter(raw, true);
    if (!remoteOk) toast('网络异常，信件已存本机，跨设备查收可能不可用');
  });

  $('#btnCopy').addEventListener('click', function () {
    var text = state.password || sealPwEl.textContent || '';
    if (!text) { toast('没有可复制的密码'); return; }

    function fallbackCopy() {
      var box = document.createElement('textarea');
      box.value = text;
      box.setAttribute('readonly', '');
      box.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
      document.body.appendChild(box);
      box.select();
      box.setSelectionRange(0, box.value.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(box);
      return ok;
    }

    function done(ok) {
      if (!ok) { toast('复制失败，请长按密码手动复制'); return; }
      toast('密码已复制，快发给 TA 吧');
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        function () { done(true); },
        function () { done(fallbackCopy()); }
      );
    } else {
      done(fallbackCopy());
    }
  });

  $('#btnAgain').addEventListener('click', function () {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    resetLetter();
    ta.value = '';
    refreshCount();
    showScene('s-pick');
    loadSwiper(initSwiper);
    if (swiper) {
      var i = 0;
      for (var k = 0; k < CARDS.length; k++) { if (CARDS[k].id === state.card) { i = k; } }
      swiper.slideToLoop(i, 0, false);
    }
    applyCard(state.card);
  });

  /* ================= 商品选择与密码封存 ================= */
  var pwEl = $('#pw');
  var sealPwEl = $('#sealPw');
  state.good = 'wreath';
  state.password = '';

  $$('#goods .good').forEach(function (btn) {
    btn.addEventListener('click', function () {
      $$('#goods .good').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      state.good = btn.getAttribute('data-good');
    });
  });

  pwEl.addEventListener('input', function () {
    pwEl.value = pwEl.value.replace(/[^A-Za-z0-9]/g, '').slice(0, 8);
  });

  var LS_KEY = 'xmas_letters_v1';
  function readAll() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function saveLetter(l) {
    var all = readAll();
    all[l.password] = l;
    try { localStorage.setItem(LS_KEY, JSON.stringify(all)); }
    catch (e) { toast('当前浏览器无法保存，请退出无痕模式'); }
  }
  function findLetter(pw) { return readAll()[pw] || null; }
  function latestLetter() {
    var all = readAll(), best = null;
    Object.keys(all).forEach(function (k) {
      if (!best || (all[k].ts || 0) > (best.ts || 0)) best = all[k];
    });
    return best;
  }

  /* ================= 后端存储：跨设备密码查收 ================= */
  var API_BASE = 'https://xmas-letter-server-production.up.railway.app';
  function packLetter(l) {
    return JSON.stringify({ p: l.product, c: l.card, t: l.message });
  }
  function unpackLetter(pw, raw) {
    try {
      var o = JSON.parse(raw);
      if (o && typeof o.t === 'string') {
        return {
          password: pw,
          product: o.p === 'apple' ? 'apple' : 'wreath',
          card: ['gold', 'rose', 'ice'].indexOf(o.c) >= 0 ? o.c : 'gold',
          message: o.t
        };
      }
    } catch (e) { /* 旧版纯文本信件 */ }
    return { password: pw, product: 'wreath', card: 'gold', message: String(raw || '') };
  }
  async function remoteSave(l) {
    var r = await fetch(API_BASE + '/api/letters', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: l.password, message: packLetter(l) })
    });
    if (!r.ok) throw new Error('save failed ' + r.status);
  }
  async function remoteFind(pw) {
    var r = await fetch(API_BASE + '/api/letters/' + encodeURIComponent(pw));
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('find failed ' + r.status);
    var j = await r.json();
    return unpackLetter(pw, j.message);
  }

  /* 再做一张时一并清空密码框 */
  $('#btnAgain').addEventListener('click', function () {
    pwEl.value = '';
    state.password = '';
  });

  /* ================= 查收弹窗 ================= */
  var modal = $('#modal');
  var pwIn = $('#pwIn');

  function openModal() {
    pwIn.value = '';
    modal.classList.add('show');
    setTimeout(function () { try { pwIn.focus(); } catch (e) {} }, 380);
  }
  function closeModal() { modal.classList.remove('show'); }

  $('#btnReceive').addEventListener('click', openModal);
  $('#mClose').addEventListener('click', closeModal);
  $('#mMask').addEventListener('click', closeModal);

  pwIn.addEventListener('input', function () {
    pwIn.value = pwIn.value.replace(/[^A-Za-z0-9]/g, '').slice(0, 8);
  });
  pwIn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#btnOpen').click(); }
  });

  $('#btnOpen').addEventListener('click', async function () {
    var pw = pwIn.value.trim();
    if (pw.length !== 8) { toast('请输入 8 位密码'); return; }
    var btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      var l = findLetter(pw);
      if (!l) {
        try {
          l = await remoteFind(pw);
          if (l) { l.ts = Date.now(); saveLetter(l); }
        } catch (e) {
          toast('网络异常，请稍后重试');
          return;
        }
      }
      if (!l) { toast('没有找到这封信，检查一下密码吧'); return; }
      closeModal();
      openGift(l);
    } finally {
      btn.disabled = false;
    }
  });

  /* ================= 送给自己 ================= */
  $('#btnSelf').addEventListener('click', function () {
    var l = latestLetter();
    if (!l) {
      toast('还没有封存的信，先写一封吧');
      showScene('s-compose');
      return;
    }
    openGift(l);
  });

  /* ================= 3D 礼物盒流程 ================= */
  var gift = $('#gift');
  var giftStage = $('#giftStage');
  var giftPaper = $('#giftPaper');
  var giftActs = $('#giftActs');
  var gMsg = $('#gMsg');
  var charmEl = $('#charm');

  function openGift(l) {
    applyCard(l.card || 'gold');
    state.good = l.product;
    state.text = l.message;
    state.password = l.password || '';
    charmEl.setAttribute('data-k', l.product === 'apple' ? 'apple' : 'wreath');
    showScene('s-gift');
    playGift(l.message);
  }

  function playGift(msg) {
    gift.classList.remove('enter', 'open', 'bloom');
    giftStage.classList.remove('settle');
    giftPaper.classList.remove('show');
    giftActs.classList.remove('show');
    gMsg.textContent = '';

    /* 强制 reflow，保证再次进入时动画重播 */
    void gift.offsetWidth;

    sleep(120).then(function () {
      gift.classList.add('enter');            /* 旋转入场 */
      return sleep(1250);
    }).then(function () {
      gift.classList.add('open');             /* 盖子向上打开 */
      return sleep(820);
    }).then(function () {
      gift.classList.add('bloom');            /* 四壁花瓣绽放 */
      giftStage.classList.add('settle');
      return sleep(1150);
    }).then(function () {
      giftPaper.classList.add('show');        /* 信纸浮现 */
      return sleep(700);
    }).then(function () {
      return typewriter(gMsg, msg, 46);
    }).then(function () {
      return sleep(360);
    }).then(function () {
      giftActs.classList.add('show');
    });
  }

  $('#btnGiftBack').addEventListener('click', function () {
    showScene('s-pick');
    loadSwiper(initSwiper);
  });

  /* ================= 启动 ================= */
  (function boot() {
    var q = new URLSearchParams(location.search);
    var incoming = (q.get('text') || q.get('msg') || '').trim();
    var cardParam = (q.get('card') || '').trim();

    applyCard('gold');
    if (incoming) {
      for (var i = 0; i < CARDS.length; i++) {
        if (CARDS[i].id === cardParam) { applyCard(cardParam); break; }
      }
      $$('.scene').forEach(function (s) { s.classList.remove('on'); });
      document.getElementById('s-letter').classList.add('on');
      setTimeout(function () { playLetter(incoming, false); }, 260);
    } else {
      showScene('s-pick');
      loadSwiper(initSwiper);
    }
  })();
})();

</script>
</body>
</html>
